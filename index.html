<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0c10">
<title>kewehhh — Script Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c10;--bg-soft:#0f1319;--card:#141921;--card-2:#1a2029;
  --line:#232b38;--line-2:#2e3848;
  --text:#eef3fa;--muted:#7f8b9d;--muted-2:#586274;
  --accent:#4dd4c0;--accent-2:#3bb8a6;--accent-glow:rgba(77,212,192,.4);
  --danger:#ff6b6b;--radius:18px;
  --shadow:0 24px 80px rgba(0,0,0,.6);
  --shadow-sm:0 8px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:"Inter",system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;outline:none}
a{color:var(--accent);text-decoration:none}
img{display:block;max-width:100%}
.site-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:14px max(20px,4%);background:rgba(10,12,16,.88);backdrop-filter:blur(24px);border-bottom:1px solid var(--line)}
.brand{font-family:"Space Grotesk",sans-serif;font-size:20px;font-weight:700;letter-spacing:1px;flex-shrink:0}
.accent{color:var(--accent)}
.tabs{display:flex;gap:3px;flex:1;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;overflow-x:auto;max-width:640px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;transition:all .25s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--accent);color:#031210;box-shadow:0 4px 16px var(--accent-glow)}
.hero{position:relative;width:100%;aspect-ratio:16/9;max-height:70vh;overflow:hidden;background:linear-gradient(135deg,#0a0c10,#1a2029);display:flex;align-items:flex-end}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,16,.4),rgba(10,12,16,.1) 35%,rgba(10,12,16,.95))}
.hero-content{position:relative;z-index:2;padding:0 max(24px,6%) 7%}
.hero-eyebrow{font-size:11px;letter-spacing:5px;color:var(--accent);font-weight:700;margin-bottom:12px}
.hero-title{font-family:"Space Grotesk",sans-serif;font-size:clamp(42px,9vw,96px);font-weight:700;letter-spacing:-2px;color:#fff;line-height:.95}
.hero-sub{font-size:clamp(13px,2vw,16px);color:rgba(255,255,255,.75);margin-top:14px}
.main{max-width:1320px;margin:0 auto;padding:0 max(20px,4%) 120px}
.page{animation:fadeIn .4s both}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:44px 0 24px}
.eyebrow{font-size:11px;letter-spacing:4px;color:var(--accent);font-weight:700;margin-bottom:10px}
.page-head h2{font-family:"Space Grotesk",sans-serif;font-size:clamp(28px,5vw,44px);font-weight:700;letter-spacing:-1px}
.search{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:28px;transition:all .25s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}
.search svg{color:var(--muted);flex-shrink:0}
.search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:15px;min-width:0}
.search input::placeholder{color:var(--muted-2)}
.search-go{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#031210;display:flex;align-items:center;justify-content:center}
.script-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.script-card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-align:left;cursor:pointer;transition:all .35s}
.script-card:hover{transform:translateY(-4px);border-color:var(--line-2);box-shadow:var(--shadow-sm)}
.image-wrap{position:relative;aspect-ratio:16/9;background:var(--bg-soft);overflow:hidden}
.image-wrap img{width:100%;height:100%;object-fit:cover}
.image-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:"Space Grotesk",sans-serif;font-size:40px;font-weight:700;color:var(--muted-2);background:linear-gradient(135deg,var(--bg-soft),var(--card-2))}
.status{position:absolute;top:12px;left:12px;padding:5px 12px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:1px;backdrop-filter:blur(12px)}
.status.working{background:rgba(77,212,192,.2);color:var(--accent);border:1px solid rgba(77,212,192,.5)}
.status.patched{background:rgba(255,107,107,.2);color:var(--danger);border:1px solid rgba(255,107,107,.5)}
.card-body{padding:16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.game-name{font-size:10.5px;letter-spacing:2px;color:var(--accent);font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body h2{font-size:15.5px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:auto;padding-top:10px}
.card-meta .verified{color:var(--accent);font-weight:700}
.load-state{display:flex;align-items:center;justify-content:center;gap:12px;padding:44px 0;color:var(--muted);font-size:13px}
.spinner{width:20px;height:20px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:80px 0;color:var(--muted)}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(4,6,10,.9);backdrop-filter:blur(16px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:5vh 16px}
.detail-panel{width:min(820px,100%);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:6vh}
.detail-topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;gap:14px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;color:var(--muted);background:transparent;transition:all .2s;flex-shrink:0}
.icon-btn:hover{background:var(--card-2);color:var(--text)}
.detail-actions .copy{display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:700;background:var(--accent);border:1px solid var(--accent);color:#031210}
.detail-cover{position:relative;aspect-ratio:16/9;background:var(--bg-soft)}
.detail-cover img{width:100%;height:100%;object-fit:cover}
.detail-cover > div{position:absolute;left:0;right:0;bottom:0;padding:24px 28px;background:linear-gradient(transparent,rgba(0,0,0,.92))}
.detail-cover p{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:700;text-transform:uppercase}
.detail-cover h2{font-size:22px;font-weight:800;color:#fff;margin-top:6px}
.detail-content{padding:26px 28px}
.detail-stats{display:flex;gap:24px;font-size:13px;color:var(--muted);margin-bottom:16px}
.detail-key{display:inline-block;padding:7px 16px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid var(--accent);color:var(--accent);margin-bottom:24px}
.detail-content h3{font-size:12px;letter-spacing:2.5px;color:var(--muted);margin-bottom:12px}
.features-text{color:var(--text);line-height:1.75;white-space:pre-line;margin-bottom:24px}
pre{background:var(--bg-soft);border:1px solid var(--line);border-radius:14px;padding:18px;overflow-x:auto}
pre code{font-family:Consolas,Menlo,monospace;font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-all;color:var(--accent)}
.footer{text-align:center;padding:40px 20px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);margin-top:60px}
@media(max-width:700px){
  .main{padding:0 16px 100px}
  .page-head{padding:32px 0 20px}
  .tab{padding:8px 14px;font-size:12px}
  .brand{font-size:17px}
  .script-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
}
</style>
</head>
<body>

<section class="hero">
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <p class="hero-eyebrow">ROBLOX / SCRIPT ARCHIVE</p>
    <h1 class="hero-title">kewehhh<span class="accent">.</span></h1>
    <p class="hero-sub">Script pilihan. Auto-update.</p>
  </div>
</section>

<header class="site-header">
  <button class="brand" id="homeBtn">kewehhh<span class="accent">.</span></button>
  <nav class="tabs" id="mainNav">
    <button class="tab active" data-tab="scripts">Scripts</button>
    <button class="tab" data-tab="owner">Owner</button>
  </nav>
</header>

<main class="main">

  <section class="page" id="scriptsPage">
    <div class="page-head">
      <div>
        <p class="eyebrow">ROBLOX / SCRIPT</p>
        <h2>Script Terbaru</h2>
      </div>
    </div>
    <form class="search" id="searchForm" autocomplete="off">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input id="searchInput" placeholder="Cari script…">
      <button type="submit" class="search-go">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </form>
    <div class="script-grid" id="grid"></div>
    <p class="empty-state" id="empty" hidden>Script tidak ditemukan</p>
    <div class="load-state" id="loadState"></div>
  </section>

  <section class="page" id="ownerPage" hidden>
    <div class="page-head">
      <div>
        <p class="eyebrow">OWNER</p>
        <h2>kewehhh<span class="accent">.</span></h2>
      </div>
    </div>
    <div style="background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px">
      <p style="color:var(--muted);margin-bottom:20px">Script pilihan oleh kewehhh. Join channel untuk update.</p>
      <a href="https://whatsapp.com/channel/0029VbECMiAAojYu33oXXt3x" 
         target="_blank" rel="noreferrer"
         style="display:inline-block;background:var(--accent);color:#031210;font-weight:700;padding:14px 24px;border-radius:14px;text-decoration:none">
        Join WhatsApp Channel
      </a>
    </div>
  </section>

</main>

<footer class="footer">
  © 2025 kewehhh. All rights reserved.
</footer>

<div class="overlay" id="overlay" hidden>
  <article class="detail-panel" id="panel"></article>
</div>

<script>
const $ = id => document.getElementById(id);
const $$ = sel => document.querySelectorAll(sel);
const esc = s => {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
};
function compact(v){
  v = v || 0;
  if (v >= 1e6) return (v/1e6).toFixed(1).replace(/\.0$/,"") + "M";
  if (v >= 1e3) return (v/1e3).toFixed(1).replace(/\.0$/,"") + "K";
  return String(v);
}

let scripts = [];
let filtered = [];
let activeQuery = "";

async function loadScripts(){
  const el = $("loadState");
  el.innerHTML = '<span class="spinner"></span>Memuat…';
  try {
    const r = await fetch("/.netlify/functions/get-scripts", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    scripts = (d.scripts || []).map(s => ({
      _id: String(s.id),
      title: s.title || "Untitled",
      game: s.game || "Universal",
      image: s.image || "",
      views: s.views || 0,
      likeCount: s.likeCount || 0,
      keyless: s.keyless !== false,
      isPatched: !!s.isPatched,
      verified: !!s.verified,
      features: s.features || "",
      script: s.script || ""
    }));
    filtered = scripts;
    renderGrid();
    el.textContent = d.total ? `Total ${d.total} script` : "";
  } catch(e) {
    console.error(e);
    el.textContent = "Gagal memuat script";
    $("empty").hidden = false;
    $("empty").textContent = "Script belum tersedia. Coba lagi nanti.";
  }
}

function cardHTML(s){
  const url = s.image;
  return `<button class="script-card" data-id="${esc(s._id)}">
    <div class="image-wrap">
      ${url
        ? `<img loading="lazy" src="${esc(url)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'image-fallback',textContent:'D'}))">`
        : `<div class="image-fallback">D</div>`}
      <span class="status ${s.isPatched ? "patched" : "working"}">${s.isPatched ? "PATCHED" : "WORKING"}</span>
    </div>
    <div class="card-body">
      <p class="game-name">${esc(s.game)}</p>
      <h2>${esc(s.title)}</h2>
      <div class="card-meta">
        <span>Views ${compact(s.views)}</span>
        <span>Likes ${compact(s.likeCount)}</span>
        ${s.verified ? '<span class="verified">VERIFIED</span>' : ""}
      </div>
    </div>
  </button>`;
}
function renderGrid(){
  const grid = $("grid");
  grid.innerHTML = filtered.map(cardHTML).join("");
  $("empty").hidden = filtered.length > 0;
  if (!filtered.length) $("empty").textContent = "Script tidak ditemukan";
}

$("searchForm").addEventListener("submit", e => {
  e.preventDefault();
  activeQuery = $("searchInput").value.trim().toLowerCase();
  if (!activeQuery) { filtered = scripts; }
  else {
    filtered = scripts.filter(s =>
      (s.title + " " + s.game + " " + s.features).toLowerCase().includes(activeQuery)
    );
  }
  renderGrid();
});

let selectedScript = null;
let scriptCopied = false;

function openScript(item){
  selectedScript = item;
  scriptCopied = false;
  renderDetail();
  $("overlay").hidden = false;
  document.body.style.overflow = "hidden";
}
function closeDetail(){
  $("overlay").hidden = true;
  document.body.style.overflow = "";
  selectedScript = null;
}
function renderDetail(){
  const s = selectedScript;
  if (!s) return;
  const url = s.image;
  $("panel").innerHTML = `
    <div class="detail-topbar">
      <button class="icon-btn" id="backBtn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <div class="detail-actions">
        <button class="copy" id="copyBtn" ${s.script ? "" : "disabled"}>
          ${scriptCopied ? "✓ Tersalin" : "Salin Script"}
        </button>
      </div>
    </div>
    <div class="detail-cover">
      ${url ? `<img src="${esc(url)}" alt="">` : ""}
      <div>
        <p>${esc(s.game)}</p>
        <h2>${esc(s.title)}</h2>
      </div>
    </div>
    <div class="detail-content">
      <div class="detail-stats">
        <span>Views ${compact(s.views)}</span>
        <span>Likes ${compact(s.likeCount)}</span>
      </div>
      <div class="detail-key">${s.keyless ? "TANPA KEY" : "BUTUH KEY"}</div>
      <h3>KETERANGAN</h3>
      <p class="features-text">${esc(s.features || "—")}</p>
      <h3>SCRIPT</h3>
      <pre><code>${esc(s.script || "—")}</code></pre>
    </div>
  `;
  $("backBtn").onclick = closeDetail;
  $("copyBtn").onclick = copyScript;
}
function copyScript(){
  if (!selectedScript?.script) return;
  const text = selectedScript.script.trim();
  const done = () => {
    scriptCopied = true;
    renderDetail();
    setTimeout(() => {
      scriptCopied = false;
      if (selectedScript) renderDetail();
    }, 1800);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.append(ta);
  ta.select();
  document.execCommand("copy");
  ta.remove();
  done();
}
$("overlay").addEventListener("mousedown", e => {
  if (e.target === $("overlay")) closeDetail();
});
$("grid").addEventListener("click", e => {
  const c = e.target.closest(".script-card");
  if (!c) return;
  const f = scripts.find(s => s._id === c.dataset.id);
  if (f) openScript(f);
});

const PAGES = { scripts: "scriptsPage", owner: "ownerPage" };
function setTab(tab){
  if (!PAGES[tab]) tab = "scripts";
  $$(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  Object.keys(PAGES).forEach(k => {
    const el = $(PAGES[k]);
    if (el) el.hidden = k !== tab;
  });
  window.scrollTo({ top: 0, behavior: "smooth" });
}
$$(".tab").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
$("homeBtn").addEventListener("click", () => setTab("scripts"));

loadScripts();
console.log("kewehhh loaded ✅");
</script>

</body>
</html>
